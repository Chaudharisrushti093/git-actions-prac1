name: Cron Job Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  cron-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print Message
        run: echo "Cron job started!"

      - name: Show Current Date
        run: date

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la

      - name: Completion Message
        run: echo "Cron job completed successfully!"
